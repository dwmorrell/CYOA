name: Deploy to GitHub Pages

# Builds a release artifact and, after a human approves the protected
# `production` environment, publishes it to GitHub Pages. Story publication
# is a separate, gated process (npm run story -- publish) and is never
# performed by any workflow - this only ships whatever code and catalog are
# already on the deployed branch.

on:
  workflow_dispatch:
    inputs:
      note:
        description: Why this build is being prepared
        required: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Record build provenance
        env:
          NOTE: ${{ github.event.inputs.note }}
        run: |
          {
            echo "commit=${GITHUB_SHA}"
            echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "note=${NOTE}"
          } > dist/BUILD_INFO.txt
      - uses: actions/upload-artifact@v4
        with:
          name: story-quest-dist-${{ github.sha }}
          path: dist/
          retention-days: 30
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
